<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="100%" height="100%">
  <defs>
    <style>
      .grid-line { stroke: #d5d5d5; stroke-width: 2; }
      .axis { stroke: #000000; stroke-width: 3; stroke-linecap: square; }
      .axis-text { font-family: 'Inter', sans-serif; font-size: 36px; fill: #000000; text-anchor: middle; }
      .vector-text { font-family: 'Inter', serif; font-size: 40px; fill: #b01a1a; font-weight: bold; }
      .span-text { font-family: 'Inter', sans-serif; font-size: 40px; fill: #054114; }
      .span-line { stroke: #054114; stroke-width: 6; stroke-dasharray: 16, 12; stroke-linecap: round; }
      .vector { stroke: #b01a1a; stroke-width: 9; stroke-linecap: round; }
      .point { fill: #054114; stroke: #000000; stroke-width: 2.5; }
    </style>
  </defs>

  <rect width="1000" height="500" fill="#ffffff" />

  <g>
    <line x1="100" y1="0" x2="100" y2="500" class="grid-line" />
    <line x1="200" y1="0" x2="200" y2="500" class="grid-line" />
    <line x1="300" y1="0" x2="300" y2="500" class="grid-line" />
    <line x1="400" y1="0" x2="400" y2="500" class="grid-line" />
    <line x1="500" y1="0" x2="500" y2="500" class="grid-line" />
    <line x1="600" y1="0" x2="600" y2="500" class="grid-line" />
    <line x1="700" y1="0" x2="700" y2="500" class="grid-line" />
    <line x1="800" y1="0" x2="800" y2="500" class="grid-line" />
    <line x1="900" y1="0" x2="900" y2="500" class="grid-line" />

    <line x1="0" y1="100" x2="1000" y2="100" class="grid-line" />
    <line x1="0" y1="200" x2="1000" y2="200" class="grid-line" />
    <line x1="0" y1="300" x2="1000" y2="300" class="grid-line" />
    <line x1="0" y1="400" x2="1000" y2="400" class="grid-line" />
    
    <rect x="0" y="0" width="1000" height="500" fill="none" stroke="#d5d5d5" stroke-width="4" />
  </g>

  <g>
    <line x1="0" y1="300" x2="975" y2="300" class="axis" />
    <polygon points="1000,300 970,288 970,312" fill="#000000" />

    <line x1="400" y1="500" x2="400" y2="25" class="axis" />
    <polygon points="400,0 388,30 412,30" fill="#000000" />
  </g>

  <line x1="0" y1="500" x2="1000" y2="0" class="span-line" />



  <circle cx="200" cy="400" r="15" class="point" />
  <circle cx="400" cy="300" r="15" class="point" />
  <circle cx="600" cy="200" r="15" class="point" />
  <circle cx="800" cy="100" r="15" class="point" />

<g>
  <line x1="400" y1="300" x2="570" y2="215" class="vector" />
  <g transform="translate(600,200) rotate(-26.565)">
    <polygon points="0,0 -44,-24 -44,0 -44,24" fill="#b01a1a" />
  </g>
</g>
  
  <g class="axis-text">
    <text x="100" y="345">−3</text>
    <text x="200" y="345">−2</text>
    <text x="300" y="345">−1</text>
    <text x="425" y="345">0</text>
    <text x="500" y="345">1</text>
    <text x="600" y="345">2</text>
    <text x="700" y="345">3</text>
    <text x="800" y="345">4</text>
    <text x="900" y="345">5</text>

    <text x="375" y="112" text-anchor="end">2</text>
    <text x="375" y="212" text-anchor="end">1</text>
    <text x="375" y="412" text-anchor="end">−1</text>
  </g>

  <g class="span-text">
    <text x="135" y="390" text-anchor="middle"><tspan font-style="italic">t</tspan> = −1</text>
    <text x="400" y="250" text-anchor="middle"><tspan font-style="italic">t</tspan> = 0</text>
    <text x="600" y="150" text-anchor="middle"><tspan font-style="italic">t</tspan> = 1</text>
    <text x="825" y="50" text-anchor="middle"><tspan font-style="italic">t</tspan> = 2</text>
  </g>

  <g>
    <text x="490" y="235" class="vector-text" font-style="bold">v</text>
    <text x="615" y="245" class="vector-text">(2,1)</text>
  </g>
</svg>

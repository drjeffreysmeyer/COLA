<svg xmlns="http://w3.org" viewBox="0 0 350 200" width="100%" height="100%">
  <defs>
    <!-- Text styling for consistency across renders -->
    <style>
      .matrix-text {
        font-family: 'Times New Roman', Times, serif;
        font-style: italic;
        font-size: 22px;
        fill: #000000;
        text-anchor: middle;
        dominant-baseline: central;
      }
    </style>
  </defs>

  <!-- Background color -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <g transform="translate(10, 0)">
    <!-- Blue Diagonals (Downward) -->
    <g opacity="0.4" stroke="#0000ff" stroke-width="14" stroke-linecap="round">
      <line x1="45" y1="45" x2="165" y2="155" />
      <line x1="85" y1="45" x2="205" y2="155" />
      <line x1="125" y1="45" x2="245" y2="155" />
    </g>

    <!-- Red Diagonals (Upward) -->
    <g opacity="0.4" stroke="#ff0000" stroke-width="16" stroke-linecap="round">
      <line x1="45" y1="155" x2="125" y2="45" />
      <line x1="85" y1="155" x2="165" y2="45" />
      <line x1="125" y1="155" x2="205" y2="45" />
    </g>

    <!-- Matrix Bracket: Left [ -->
    <path d="M 30,30 L 20,30 L 20,170 L 30,170" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="square" />
    
    <!-- Matrix Bracket: Right ] (Closes after the 3rd column) -->
    <path d="M 140,30 L 150,30 L 150,170 L 140,170" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="square" />

    <!-- Row 1 Elements -->
    <text x="45" y="45" class="matrix-text">a</text>
    <text x="85" y="45" class="matrix-text">b</text>
    <text x="125" y="45" class="matrix-text">c</text>
    <text x="165" y="45" class="matrix-text">a</text>
    <text x="205" y="45" class="matrix-text">b</text>

    <!-- Row 2 Elements -->
    <text x="45" y="100" class="matrix-text">d</text>
    <text x="85" y="100" class="matrix-text">e</text>
    <text x="125" y="100" class="matrix-text">f</text>
    <text x="165" y="100" class="matrix-text">d</text>
    <text x="205" y="100" class="matrix-text">e</text>

    <!-- Row 3 Elements -->
    <text x="45" y="155" class="matrix-text">g</text>
    <text x="85" y="155" class="matrix-text">h</text>
    <text x="125" y="155" class="matrix-text">i</text>
    <text x="165" y="155" class="matrix-text">g</text>
    <text x="205" y="155" class="matrix-text">h</text>
  </g>
</svg>
